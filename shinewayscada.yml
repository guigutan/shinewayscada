services:
  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - api
      - it
      - scada
    ports:
      - "80:80"
    volumes:
      - ./docker/gateway.conf:/etc/nginx/conf.d/default.conf:ro

  api:
    build:
      context: ../shinewayapi
    restart: unless-stopped
    env_file:
      - ../shinewayapi/.env
    expose:
      - "7003"

  it:
    build:
      context: ../shinewayit
    restart: unless-stopped
    expose:
      - "80"

  scada:
    build:
      context: .
    restart: unless-stopped
    expose:
      - "80"
